plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.krupapiotr.mediaprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.krupapiotr.mediaprobe.sidebyside'
        minSdk 23
        targetSdk 32
        versionCode 131
        versionName '1.3.1-k706-test-obok-1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}


dependencies { testImplementation "junit:junit:4.13.2" }
