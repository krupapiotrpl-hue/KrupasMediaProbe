plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.krupapiotr.mediaprobe'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file('krupas-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'pl.krupapiotr.mediaprobe'
        minSdk 23
        targetSdk 32
        versionCode 30
        versionName '3.0-DIAG1'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
