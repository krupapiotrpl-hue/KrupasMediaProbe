name: KRUPAS Media Pro 0.9 APK
on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Wybierz edytowalne zrodla lub archiwum 0.8
        run: |
          if [ ! -f source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/MediaBridgeService.java ]; then
            mkdir -p source
            tar -xzf KRUPAS_Media_Pro_0.8_source.tar.gz -C source
          fi
          test -f source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/MediaBridgeService.java
      - name: Przygotuj Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Kompiluj APK
        run: gradle -p source/KrupasMediaProbe assembleDebug --no-daemon --console=plain --stacktrace
      - name: Zweryfikuj i nazwij APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose source/KrupasMediaProbe/app/build/outputs/apk/debug/app-debug.apk
          cp source/KrupasMediaProbe/app/build/outputs/apk/debug/app-debug.apk KRUPAS-Media-Pro-0.9-K706.apk
          sha256sum KRUPAS-Media-Pro-0.9-K706.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KRUPAS-Media-Pro-0.9-K706-APK
          path: KRUPAS-Media-Pro-0.9-K706.apk
          if-no-files-found: error
      - name: Opublikuj instalator w GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view 'v0.9-k706' >/dev/null 2>&1; then
            gh release create 'v0.9-k706' --title 'KRUPAS Media Pro 0.9 (K706)' --notes 'Testowa wersja BLE + MP3 + FM/RDS. APK debug; mozliwy konflikt podpisu ze stara instalacja.'
          fi
          gh release upload 'v0.9-k706' KRUPAS-Media-Pro-0.9-K706.apk --clobber
        continue-on-error: true
