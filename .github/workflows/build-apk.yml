name: Zbuduj instalator APK 0.6.5 TEST
on:
  push:
    branches: [fix/0.6.5-rds-placeholders]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test source expiry lifecycle
        run: |
          mkdir -p test-classes
          javac -d test-classes ble-patch/DisplayLease.java ble-patch/MediaTitles.java ble-patch/SourceSelector.java tests/DisplayLeaseTest.java tests/MediaSourcesTest.java ble-patch/UiMediaTitle.java ble-patch/RdsText.java ble-patch/BlePayload.java tests/UiAndBleTest.java ble-patch/StableTitle.java tests/StableTitleTest.java
          java -cp test-classes pl.krupapiotr.mediaprobe.StableTitleTest
          java -cp test-classes pl.krupapiotr.mediaprobe.UiAndBleTest
          java -cp test-classes pl.krupapiotr.mediaprobe.MediaSourcesTest
          java -cp test-classes pl.krupapiotr.mediaprobe.DisplayLeaseTest
          python3 tests/test_firmware_expiry.py

      - name: Rozpakuj projekt
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("KRUPAS_Media_Probe_0.1_CLEAN.zip") as archive:
              archive.extractall("source")
          PY

      - name: Wstaw KRUPAS MEDIA 0.6.5 TEST
        run: |
          cp ble-patch/StableTitle.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/
          cp ble-patch/RdsText.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/
          cp ble-patch/UiMediaTitle.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/
          cp ble-patch/BlePayload.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/
          cp ble-patch/MediaTitles.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/
          cp ble-patch/SourceSelector.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/
          cp ble-patch/MediaProbeNotificationService.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/
          cp ble-patch/DisplayLease.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/DisplayLease.java
          cp ble-patch/BleDisplayClient.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/BleDisplayClient.java
          cp ble-patch/MainActivity.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/MainActivity.java
          cp ble-patch/RdsAccessibilityService.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/RdsAccessibilityService.java
          cp ble-patch/MediaBridgeService.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/MediaBridgeService.java
          cp ble-patch/BootReceiver.java source/KrupasMediaProbe/app/src/main/java/pl/krupapiotr/mediaprobe/BootReceiver.java
          cp ble-patch/AndroidManifest.xml source/KrupasMediaProbe/app/src/main/AndroidManifest.xml
          mkdir -p source/KrupasMediaProbe/app/src/main/res/xml
          cp ble-patch/krupas_rds_accessibility.xml source/KrupasMediaProbe/app/src/main/res/xml/krupas_rds_accessibility.xml
          cp ble-patch/app-build.gradle source/KrupasMediaProbe/app/build.gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Zbuduj APK
        run: gradle -p source/KrupasMediaProbe assembleDebug --no-daemon --console=plain

      - name: Sprawdz podpis instalatora
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose source/KrupasMediaProbe/app/build/outputs/apk/debug/app-debug.apk
          cp source/KrupasMediaProbe/app/build/outputs/apk/debug/app-debug.apk KRUPAS-Media-Probe-0.6.5-AUTO-MP3-FIX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KRUPAS-Media-Probe-0.6.5-AUTO-MP3-FIX
          path: KRUPAS-Media-Probe-0.6.5-AUTO-MP3-FIX.apk
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile ESP32-S3 firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 --output-dir esp-build firmware/KRUPAS_OPEL_DISPLAY_v1_9f_TEST_EXPIRY
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-1.9f-TEST-EXPIRY
          path: |
            firmware/KRUPAS_OPEL_DISPLAY_v1_9f_TEST_EXPIRY
            esp-build
          if-no-files-found: error

