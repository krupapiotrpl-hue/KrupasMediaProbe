name: KRUPAS Media Pro 1.3.7 K706 TEST
on:
  push:
    branches: ['fix/kmp-137-source-access-20261115']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Test and build
        run: gradle -p source/KrupasMediaProbe testDebugUnitTest assembleDebug --no-daemon --console=plain --stacktrace
      - name: Verify test APK
        run: |
          cp source/KrupasMediaProbe/app/build/outputs/apk/debug/app-debug.apk KRUPAS-Media-Pro-1.3.7-SOURCE-ACCESS-K706-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose KRUPAS-Media-Pro-1.3.7-SOURCE-ACCESS-K706-TEST.apk
          sha256sum KRUPAS-Media-Pro-1.3.7-SOURCE-ACCESS-K706-TEST.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KRUPAS-Media-Pro-1.3.7-SOURCE-ACCESS-K706-TEST
          path: |
            KRUPAS-Media-Pro-1.3.7-SOURCE-ACCESS-K706-TEST.apk
            SHA256SUMS.txt
            source/KrupasMediaProbe/firmware/Krupas_1_9x22_EMPTY_REFRESH/Krupas_1_9x22_EMPTY_REFRESH.ino
            source/KrupasMediaProbe/TEST_1.3.7_K706.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K706-unit-test-results
          path: source/KrupasMediaProbe/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
