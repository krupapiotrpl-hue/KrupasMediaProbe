name: KRUPAS Media Pro 3.1 APK
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Przygotuj Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Kompiluj APK
        run: gradle -p source/KrupasMediaProbe assembleDebug --no-daemon --console=plain --stacktrace
      - name: Zweryfikuj i nazwij APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose source/KrupasMediaProbe/app/build/outputs/apk/debug/app-debug.apk
          cp source/KrupasMediaProbe/app/build/outputs/apk/debug/app-debug.apk KRUPAS-Media-Pro-3.1-K706.apk
          sha256sum KRUPAS-Media-Pro-3.1-K706.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KRUPAS-Media-Pro-3.1-K706-APK
          path: KRUPAS-Media-Pro-3.1-K706.apk
          if-no-files-found: error
