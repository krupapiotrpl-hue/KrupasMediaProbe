name: CANBUS Auto Apply test APK
on:
  push:
    branches:
      - experiment/canbus-auto-apply-20261106
    paths:
      - 'CanbusAutoApply/**'
      - '.github/workflows/canbus-auto-apply.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CanbusAutoApply
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CANBUS-Auto-Apply-test
          path: CanbusAutoApply/app/build/outputs/apk/debug/app-debug.apk
